name: CI

# Builds and checks every application in the platform workspace, then runs the
# full deterministic test suite on every PR to main and every push to main.
#
# No secrets are used and this is `pull_request` (not `pull_request_target`), so
# fork PRs run in their own context with no access to repo secrets — safe.
#
# The eval graders (harness L4) run as ordinary vitest tests, so they ride this
# job automatically once they land. The model-in-loop live eval is a separate,
# secret-gated workflow (needs ANTHROPIC_API_KEY) — see TODOS.
#
# To make this a REQUIRED check: GitHub → Settings → Branches → branch
# protection on `main` → "Require status checks to pass" → select `build-and-test`.
# (Do this after the check has run once so it's selectable.)

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

# Least privilege: build+test only reads the repo.
permissions:
  contents: read

# Cancel superseded runs on the same ref (e.g. a force-push to a PR branch).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Keep the historical job id so an existing required `build-and-test` branch
  # protection check continues to match after the workspace expansion.
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Typecheck (all apps)
        run: npm run typecheck:all
      - name: Build (all apps)
        run: npm run build:all
      - name: Test (benchmark and workspace)
        run: npm test
      - name: Audit dependencies
        run: npm audit --audit-level=high
